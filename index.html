 +(lk?'<div class="row"><div><b>Último enlace</b><div class="lk">'+esc(lk.l)+'</div></div><div><button class="btn sm" data-a="lk" data-i="'+i+'">Copiar</button><a class="btn sm s" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent('Hola, este es tu enlace para diligenciar la información sociodemográfica: '+lk.l)+'">WhatsApp</a></div></div>':'')+'</div>'
 +'<div class="pn"><h2>2. Recibidos</h2><div id="ksoc">'+socHTML()+'</div></div>'}
function socOpen(){return '<div class="pn">'+socioDoc(SOP.d)+'<div class="r2"><button class="btn s" data-a="ksclose">Cerrar vista</button><button class="btn s" data-a="ksprt">Imprimir / guardar PDF</button></div><button class="btn s" data-a="ksdel" style="border-color:#c0392b;color:#c0392b">Eliminar esta información</button><p class="sub">Descarga primero el PDF si lo vas a conservar: al eliminarla desaparece de la nube de forma definitiva.</p></div>'}
function openDoc(){const o=OPN;return '<div class="pn">'+consentDoc(o.cfg,'view',o.d)+'<div class="r2"><button class="btn s" data-a="kclose">Cerrar vista</button><button class="btn s" data-a="kprt">Imprimir / guardar PDF</button></div>'
 +(o.pend?'<button class="btn big" data-a="ksign">Firmar y cerrar documento</button><p class="sub">Al cerrar se registra la fecha, se agregan tu firma y sello y el documento queda bloqueado: nadie podrá modificarlo.</p>':(o.prev?'':'<button class="btn s" data-a="kver">Verificar integridad</button><p class="sub">Documento cerrado y bloqueado.</p>'))+(o.prev?'':'<button class="btn s" data-a="kdel" style="border-color:#c0392b;color:#c0392b">Eliminar este consentimiento</button><p class="sub">Descarga primero el PDF si lo vas a conservar: al eliminarlo desaparece de la nube de forma definitiva.</p>')+'</div>'}
const k2d=x=>({...x,at:x.at&&x.at.toMillis?x.at.toMillis():x.at,pat:x.pat&&x.pat.toMillis?x.pat.toMillis():x.pat});
const hbase=d=>({v:d.v||VER,cfg:d.cfg,name:d.name,doc:d.doc,city:d.city,phone:d.phone,sig:d.sig,at:d.at,psig:d.psig,pseal:d.pseal||''});
const KA={
 async ksmk(b){b.disabled=true;try{const d=doc(collection(db,'invites'));await setDoc(d,{t:'socio',n:(CF.pro&&CF.pro.n)||PRO,status:'pending',createdAt:serverTimestamp(),exp:Timestamp.fromMillis(Date.now()+30*864e5)});
   LK.unshift({id:d.id,l:location.origin+location.pathname+'?i='+d.id,t:'socio',at:Date.now()});LK=LK.slice(0,30);save();draw()}catch(x){b.disabled=false;$('er2').hidden=false;$('er2').textContent='No se pudo crear el enlace ('+(x.code||'error')+'). Revisa que las reglas de seguridad estén publicadas.'}},
 async ksopen(b){const id=b.dataset.id;if(!SOC[id])return;SOP={id,d:SOC[id]};seen.add(id);save();draw();scrollTo(0,0)},
 async ksclose(){SOP=null;draw()},
 async ksprt(){printHTML(socioDoc(SOP.d))},
 async ksblank(){printHTML(socioDoc({}))},
 async ksdel(b){const o=SOP;if(!confirm('¿Eliminar esta información de forma definitiva? Asegúrate de haber descargado el PDF: no se podrá recuperar.'))return;b.disabled=true;
  try{const w=writeBatch(db);w.delete(doc(db,'socios',o.id));w.delete(doc(db,'invites',o.id));await w.commit();delete SOC[o.id];LK=LK.filter(x=>x.id!==o.id);save();SOP=null;draw()}
  catch(x){b.disabled=false;alert('No se pudo eliminar ('+(x.code||'error')+').')}},
 async ksave(b){try{await cfgSave();b.textContent='¡Guardado!';setTimeout(()=>b.textContent='Guardar configuración',2000)}catch(x){alert('No se pudo guardar ('+(x.code||'error')+').')}},
 async kprev(){OPN={prev:true,cfg:cfgOut(),d:{xsig:CF.sig,xseal:CF.seal}};draw()},
 async kmk(b){b.disabled=true;try{await cfgSave();const d=doc(collection(db,'invites'));await setDoc(d,{t:'consent',n:CF.pro.n||PRO,cfg:cfgOut(),status:'pending',createdAt:serverTimestamp(),exp:Timestamp.fromMillis(Date.now()+30*864e5)});
   LK.unshift({id:d.id,l:location.origin+location.pathname+'?i='+d.id,t:'consent',at:Date.now()});LK=LK.slice(0,30);save();draw()}catch(x){b.disabled=false;$('er').hidden=false;$('er').textContent='No se pudo crear el enlace ('+(x.code||'error')+'). Revisa que las reglas de seguridad estén publicadas.'}},
 async kload(b){b.disabled=true;try{const q=await getDocs(query(collection(db,'consents'),orderBy('pat','desc'),limit(30)));CLO=q.docs.map(z=>{const x=z.data();return{id:z.id,name:x.name,doc:x.doc,pat:x.pat?x.pat.toMillis():0}});draw()}catch(x){b.disabled=false;alert('No se pudo cargar ('+(x.code||'error')+').')}},
 async kopen(b){const id=b.dataset.id;if(b.dataset.s==='p'){const x=PEND[id];OPN={id,pend:true,cfg:x.cfg,d:{...x,xsig:CF.sig,xseal:CF.seal}}}else{const s=await getDoc(doc(db,'consents',id));const x=k2d(s.data());OPN={id,cfg:x.cfg,d:x}}draw();scrollTo(0,0)},
 async kclose(){OPN=null;draw()},
 async kdel(b){const o=OPN;if(!confirm('¿Eliminar este consentimiento de forma definitiva? Asegúrate de haber descargado el PDF: no se podrá recuperar.'))return;if(!confirm('Confirma de nuevo: se borrará de la nube (Firebase).'))return;b.disabled=true;
  try{const w=writeBatch(db);w.delete(doc(db,'consents',o.id));w.delete(doc(db,'invites',o.id));await w.commit();delete PEND[o.id];if(CLO)CLO=CLO.filter(x=>x.id!==o.id);LK=LK.filter(x=>x.id!==o.id);save();OPN=null;draw()}
  catch(x){b.disabled=false;alert('No se pudo eliminar ('+(x.code||'error')+').')}},
 async kunsig(){CF.sig='';CF._m='Quitando…';draw();try{await cfgSave();CF._m='Firma eliminada de tu cuenta.'}catch(x){CF._m='No se pudo guardar ('+(x.code||'error')+').'}draw()},
 async kunseal(){CF.seal='';CF._m='Quitando…';draw();try{await cfgSave();CF._m='Sello eliminado de tu cuenta.'}catch(x){CF._m='No se pudo guardar ('+(x.code||'error')+').'}draw()},
 async kprt(){printHTML(consentDoc(OPN.cfg,'view',OPN.d))},
 async ksign(b){if(!CF.sig){alert('Primero sube tu firma en la configuración y guárdala.');return}
  if(!confirm('¿Firmar y cerrar este documento? Después no se podrá modificar.'))return;b.disabled=true;
  try{const d=OPN.d,hash=await sha(stab(hbase({...d,psig:CF.sig,pseal:CF.seal||''})));
   await updateDoc(doc(db,'consents',OPN.id),{status:'cerrado',psig:CF.sig,pseal:CF.seal||'',pat:serverTimestamp(),hash});
   const s=await getDoc(doc(db,'consents',OPN.id));const x=k2d(s.data());delete PEND[OPN.id];CLO=null;OPN={id:OPN.id,cfg:x.cfg,d:x};draw()}
  catch(x){b.disabled=false;alert('No se pudo firmar ('+(x.code||'error')+').')}},
 async kver(){const d=OPN.d,h=await sha(stab(hbase(d)));alert(h===d.hash?'Integridad verificada: el contenido y las firmas coinciden con el código registrado al cerrar.':'¡Atención! El contenido no coincide con el código registrado.')}};
async function onClick(e){
 const g=e.target.closest('[data-go]');if(g){V=g.dataset.go;if(g.dataset.t)selT=g.dataset.t;draw();return}
 const sm=e.target.closest('summary');if(sm&&sm.parentNode.dataset.id){seen.add(sm.parentNode.dataset.id);save();tabs();return}
 const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,r=C.it[id];
 if(a[0]==='k'){await KA[a](b);return}
 if(a==='mk'){b.disabled=true;try{const d=doc(collection(db,'invites'));await setDoc(d,{t:selT,n:PRO,status:'pending',createdAt:serverTimestamp(),exp:Timestamp.fromMillis(Date.now()+30*864e5)});
   LK.unshift({id:d.id,l:location.origin+location.pathname+'?i='+d.id,t:selT,at:Date.now()});LK=LK.slice(0,30);save();draw()}
  catch(x){b.disabled=false;$('er').hidden=false;$('er').textContent='No se pudo crear el enlace ('+(x.code||'error')+'). Revisa que las reglas de seguridad estén publicadas.'}}
 if(a==='lk'){try{await navigator.clipboard.writeText(LK[+b.dataset.i].l);b.textContent='¡Copiado!'}catch(x){}}
 if(a==='pb'){printDoc(b.dataset.t||selT,null);return}
 if(a==='pf'&&r){printDoc(r.t,r.ans,{name:r.name,tipo:r.tipo,doc:r.doc,x:r.x,at:r.at});return}
 if(a==='pbr'&&r){printDoc(r.t,null);return}
 if(a==='sync'){b.disabled=true;try{const q=await getDocs(query(collection(db,'invites'),orderBy('createdAt','desc'),limit(30)));LK=q.docs.map(d=>{const v=d.data();return{id:d.id,l:location.origin+location.pathname+'?i='+d.id,t:v.t,at:v.createdAt?v.createdAt.toMillis():0,st:v.status,exp:v.exp?v.exp.toMillis():0}});save();draw()}catch(x){b.disabled=false;alert('No se pudo actualizar ('+(x.code||'error')+').')}return}
 if(a==='dl'){const n=+b.dataset.i,x=LK[n];if(x&&confirm('¿Eliminar este enlace? Dejará de funcionar. Las respuestas ya recibidas no se borran.')){try{await deleteDoc(doc(db,'invites',x.id||new URL(x.l).searchParams.get('i')));LK.splice(n,1);save();draw()}catch(x2){alert('No se pudo eliminar ('+(x2.code||'error')+').')}}return}
 if(a==='cp'){const t=TESTS[r.t];try{await navigator.clipboard.writeText('RESPUESTAS '+t.n+'\n'+r.name+' · '+r.tipo+' '+r.doc+'\n'+fdt(r.at)+'\n'+[...r.ans].map((v,i)=>(FLD(t)[i].n||i+1)+': '+LBL(t,FLD(t)[i],v)).join('\n'));b.textContent='¡Copiado!'}catch(x){}}
 if(a==='del'&&confirm('¿Eliminar esta respuesta de forma definitiva?')){const w=writeBatch(db);w.delete(doc(db,'responses',id));w.delete(doc(db,'invites',id));await w.commit();delete C.it[id];save();draw()}
 if(a==='ex'){const ft=F.t||'dass21',t=TESTS[ft],q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=Object.entries(C.it).filter(([,r])=>r.t===ft).sort((x,y)=>x[1].at-y[1].at);
  const out=[['fecha','codigo','nombre','tipo_doc','documento'].concat(FLD(t).map((f,i)=>'p'+(f.n||i+1)).concat(t.lbl?['otros_especifique']:[])).map(q).join(',')].concat(rows.map(([id,r])=>[fdt(r.at),id,r.name,r.tipo,r.doc].concat([...r.ans].map((c,i)=>LBL(t,FLD(t)[i],c)),t.lbl?[r.x||'']:[]).map(q).join(',')));
  const l=document.createElement('a');l.href=URL.createObjectURL(new Blob(['\ufeff'+out.join('\n')],{type:'text/csv'}));l.download='respuestas-'+t.n+'.csv';l.click()}}
if(FB.apiKey==='PEGA_AQUI')$('app').innerHTML='<div class="pn">Falta pegar la configuración de Firebase en index.html (ver LEEME.md).</div>';
else if(ID)patient();else onAuthStateChanged(auth,u=>u?shell():login());
