<h3 class="gh">1. USO Y CONFIDENCIALIDAD DE LOS DATOS</h3>
<p style="font-size:13px;color:var(--mu);text-align:justify">Toda la información concerniente a su evaluación y tratamiento, incluyendo cualquier grabación de audio, video o reporte escrito, son confidenciales y no serán divulgadas ni entregadas a ninguna otra institución o individuo sin su consentimiento expreso, excepto cuando la orden de entrega provenga de una autoridad judicial competente. Además, de acuerdo con la ley 1090 del 2006, es necesario quebrantar este principio de confidencialidad en caso de presentarse situaciones que pongan en grave peligro su integridad física o mental o de algún otro miembro de la comunidad.</p>
<h3 class="gh">2. MODELO DE TRATAMIENTO</h3>
<p style="font-size:13px;color:var(--mu);text-align:justify">El tratamiento que se le brinda es llevado a cabo con base en un modelo psicológico empíricamente validado, que en unos casos funciona mejor que en otros. Durante las primeras sesiones, se discutirá sobre los objetivos terapéuticos y la intervención a ejecutar.</p>
<h3 class="gh">3. USO DE INSTRUMENTOS</h3>
<p style="font-size:13px;color:var(--mu);text-align:justify">El proceso de atención psicológica requiere de su compromiso de asistencia, puntualidad y participación en los diferentes instrumentos que se adopten o sean necesarios, además de su colaboración para diligenciar una serie de posibles documentos, pruebas y entrevistas, con información personal que será utilizada para la evaluación e intervención.</p>
<h3 class="gh">4. MODALIDADES DE ATENCIÓN</h3>
<p style="font-size:13px;color:var(--mu);text-align:justify"><b>4.1 ATENCIÓN PSICOLÓGICA EN MODALIDAD VIRTUAL</b><br>
Las sesiones realizadas en modalidad virtual se llevarán a cabo mediante la plataforma Google Meet, a través de videollamada.<br>Una vez confirmada la consulta mediante el pago correspondiente, el profesional enviará al usuario el enlace de acceso a la sesión. Para el adecuado desarrollo de la sesión, el usuario deberá procurar conectarse desde un lugar en el que se sienta cómodo, tranquilo y que le permita contar con privacidad y condiciones adecuadas para el desarrollo de la atención psicológica.<br>Se recomienda que el usuario se encuentre en un espacio privado, evitando en lo posible la presencia o intervención de terceros que puedan afectar la privacidad, confidencialidad o desarrollo de la sesión.<br>El usuario deberá procurar contar con un dispositivo adecuado y una conexión a internet que permitan realizar la videollamada de manera adecuada.<br><br>
<b>4.2 ATENCIÓN PSICOLÓGICA EN MODALIDAD DOMICILIARIA</b><br>
