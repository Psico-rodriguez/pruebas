 {n:'5',q:'¿Ha fingido ganar apostando cuando en realidad perdió?',o:[[0,'Nunca'],[1,'A veces (<50%)'],[2,'Casi siempre']]},

const sdv=(d,k)=>{const v=d[k]||'';return k==='psi'||k==='med'||k==='sus'?(v==='1'?'Sí':v==='0'?'No':''):k==='fnac'?v.split('-').reverse().join('/'):k==='conv'?v.split('\n').filter(Boolean).map(r=>r.split('\t').map(c=>c||'—').join(' · ')).join('\n'):v};
const UN=t=>t.socio?' secciones':t.lbl?' preguntas':' ítems';

 +FLD(t).map((f,i)=>'<div class="it" id="r'+i+'">'+(f.h?'<h3 class="gh">'+esc(f.h)+'</h3>':'')+'<p>'+(f.n||i+1)+'. '+esc(f.q)+'</p><div class="op">'+(f.c?'<label><input type="checkbox" name="q'+i+'"><span>Sí</span></label>':f.o.map(s=>'<label><input type="radio" name="q'+i+'" value="'+s[0]+'"><span>'+(t.lbl?esc(s[1]):s[0])+'</span></label>').join(''))+'</div>'+(f.x?'<input id="qx" placeholder="Especifique cuál (opcional)" maxlength="100" style="margin-top:6px">':'')+'</div>').join('')+'</div>'

 const F=FLD(t),Q=i=>document.querySelector('input[name=q'+i+']'),ck=i=>(document.querySelector('input[name=q'+i+']:checked')||{}).value;

const rowsHTML=(t,r)=>t.socio?SDL.map(([k,l])=>'<tr><td>'+esc(l)+'</td><td>'+(nl(sdv(r.d||{},k))||'—')+'</td></tr>').join(''):FLD(t).map((f,i)=>(f.h?'<tr><td colspan="2"><b>'+esc(f.h)+'</b></td></tr>':'')+'<tr><td>'+(f.n||i+1)+'. '+esc(f.q)+'</td><td>'+esc(LBL(t,f,r.ans[i]))+(f.x&&r.x?' — '+esc(r.x):'')+'</td></tr>').join('');
function listHTML(){const q=F.q.trim().toLowerCase();const a=Object.entries(C.it).filter(([,r])=>(!F.t||r.t===F.t)&&(!q||(r.name+' '+r.doc).toLowerCase().includes(q))).sort((x,y)=>y[1].at-x[1].at);
 return a.length?a.map(([id,r])=>{const t=TESTS[r.t];return '<details data-id="'+id+'"><summary><b>'+esc(r.name)+'</b> · '+esc(t.n)+' · '+fdt(r.at)+(seen.has(id)?'':'<span class="bg">nuevo</span>')+'</summary><p class="sub">'+esc(r.tipo)+' '+esc(r.doc)+'</p><table class="'+(t.lbl||t.socio?'wide':'')+'">'+rowsHTML(t,r)+'</table><button class="btn sm s" data-a="cp" data-id="'+id+'">Copiar respuestas</button><button class="btn sm s" data-a="pf" data-id="'+id+'">Imprimir diligenciado (PDF)</button><button class="btn sm s" data-a="pbr" data-id="'+id+'">Imprimir en blanco</button><button class="btn sm s" data-a="del" data-id="'+id+'">Eliminar</button></details>'}).join(''):'<p class="sub">No hay respuestas para mostrar.</p>'}
function vResp(){return '<div class="pn"><h2>Respuestas recibidas</h2><div class="r2"><select id="ft"><option value="">Todos los instrumentos</option>'+Object.entries(TESTS).map(([k,v])=>'<option value="'+k+'"'+(F.t===k?' selected':'')+'>'+esc(v.n)+'</option>').join('')+'</select><input id="fq" placeholder="Buscar por nombre o documento" value="'+esc(F.q)+'"></div><button class="btn s" data-a="ex">Exportar a CSV</button><div id="ls">'+listHTML()+'</div></div>'}
function vInst(){return Object.entries(TESTS).map(([k,t])=>'<div class="pn"><h2>'+esc(t.n)+'</h2><p style="margin:0 0 6px"><b>'+esc(t.full)+'</b></p><p class="sub">'+(t.nq||FLD(t).length)+UN(t)+' · Periodo: '+INFO[k].per+(t.sc?' · Escala '+t.sc[0][0]+' a '+t.sc[t.sc.length-1][0]:'')+'</p><p style="font-size:13.5px">'+esc(INFO[k].corr)+'</p><p class="sub">'+INFO[k].ref.map(esc).join('<br>')+'</p><details><summary>'+(t.socio?'Ver secciones':'Ver preguntas'+(t.sc?' y escala':''))+'</summary>'+(t.sc?'<p class="sub">'+t.sc.map(x=>x[0]+' = '+esc(x[1])).join(' · ')+'</p>':'')+'<table>'+FLD(t).map((f,i)=>(f.h?'<tr><td><b>'+esc(f.h)+'</b></td></tr>':'')+'<tr><td>'+(f.n||i+1)+'. '+esc(f.q)+'</td></tr>').join('')+'</table></details><button class="btn sm" data-go="enviar" data-t="'+k+'">Enviar este instrumento</button><button class="btn sm s" data-a="pb" data-t="'+k+'">Imprimir en blanco (PDF)</button></div>').join('')}
async function onClick(e){
 const g=e.target.closest('[data-go]');if(g){V=g.dataset.go;if(g.dataset.t)selT=g.dataset.t;draw();return}
 const sm=e.target.closest('summary');if(sm&&sm.parentNode.dataset.id){seen.add(sm.parentNode.dataset.id);save();tabs();return}
 const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,r=C.it[id];
 if(a==='mk'){b.disabled=true;try{const d=doc(collection(db,'invites'));await setDoc(d,{t:selT,n:PRO,status:'pending',createdAt:serverTimestamp(),exp:Timestamp.fromMillis(Date.now()+30*864e5)});
   LK.unshift({id:d.id,l:location.origin+location.pathname+'?i='+d.id,t:selT,at:Date.now()});LK=LK.slice(0,30);save();draw()}
  catch(x){b.disabled=false;$('er').hidden=false;$('er').textContent='No se pudo crear el enlace ('+(x.code||'error')+'). Revisa que las reglas de seguridad estén publicadas.'}}
 if(a==='lk'){try{await navigator.clipboard.writeText(LK[+b.dataset.i].l);b.textContent='¡Copiado!'}catch(x){}}
 if(a==='pb'){printDoc(b.dataset.t||selT,null);return}
 if(a==='pf'&&r){printDoc(r.t,r.ans,{name:r.name,tipo:r.tipo,doc:r.doc,x:r.x,d:r.d,at:r.at});return}
 if(a==='pbr'&&r){printDoc(r.t,null);return}
 if(a==='sync'){b.disabled=true;try{const q=await getDocs(query(collection(db,'invites'),orderBy('createdAt','desc'),limit(30)));LK=q.docs.map(d=>{const v=d.data();return{id:d.id,l:location.origin+location.pathname+'?i='+d.id,t:v.t,at:v.createdAt?v.createdAt.toMillis():0,st:v.status,exp:v.exp?v.exp.toMillis():0}});save();draw()}catch(x){b.disabled=false;alert('No se pudo actualizar ('+(x.code||'error')+').')}return}
 if(a==='dl'){const n=+b.dataset.i,x=LK[n];if(x&&confirm('¿Eliminar este enlace? Dejará de funcionar. Las respuestas ya recibidas no se borran.')){try{await deleteDoc(doc(db,'invites',x.id||new URL(x.l).searchParams.get('i')));LK.splice(n,1);save();draw()}catch(x2){alert('No se pudo eliminar ('+(x2.code||'error')+').')}}return}
 if(a==='cp'){const t=TESTS[r.t];try{await navigator.clipboard.writeText('RESPUESTAS '+t.n+'\n'+r.name+' · '+r.tipo+' '+r.doc+'\n'+fdt(r.at)+'\n'+(t.socio?SDL.map(([k,l])=>l+': '+(sdv(r.d||{},k).replace(/\n/g,'; ')||'—')).join('\n'):[...r.ans].map((v,i)=>(FLD(t)[i].n||i+1)+': '+LBL(t,FLD(t)[i],v)).join('\n')));b.textContent='¡Copiado!'}catch(x){}}
 if(a==='del'&&confirm('¿Eliminar esta respuesta de forma definitiva?')){const w=writeBatch(db);w.delete(doc(db,'responses',id));w.delete(doc(db,'invites',id));await w.commit();delete C.it[id];save();draw()}
 if(a==='ex'){const ft=F.t||'dass21',t=TESTS[ft],q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=Object.entries(C.it).filter(([,r])=>r.t===ft).sort((x,y)=>x[1].at-y[1].at);
  const out=[['fecha','codigo','nombre','tipo_doc','documento'].concat(t.socio?SDL.map(x=>x[1]):FLD(t).map((f,i)=>'p'+(f.n||i+1)).concat(t.lbl?['otros_especifique']:[])).map(q).join(',')].concat(rows.map(([id,r])=>[fdt(r.at),id,r.name,r.tipo,r.doc].concat(t.socio?SDL.map(([k])=>sdv(r.d||{},k).replace(/\n/g,' | ')):[...r.ans].map((c,i)=>LBL(t,FLD(t)[i],c)),t.lbl?[r.x||'']:[]).map(q).join(',')));
  const l=document.createElement('a');l.href=URL.createObjectURL(new Blob(['\ufeff'+out.join('\n')],{type:'text/csv'}));l.download='respuestas-'+t.n+'.csv';l.click()}}
if(FB.apiKey==='PEGA_AQUI')$('app').innerHTML='<div class="pn">Falta pegar la configuración de Firebase en index.html (ver LEEME.md).</div>';
else if(ID)patient();else onAuthStateChanged(auth,u=>u?shell():login());
</script></body></html>
