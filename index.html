const TXT_C1_5 = `
<h3 class="gh">1. USO Y CONFIDENCIALIDAD DE LOS DATOS</h3>
<p style="font-size:13px;color:var(--mu);text-align:justify">Toda la información concerniente a su evaluación y tratamiento, incluyendo cualquier grabación de audio, video o reporte escrito, son confidenciales y no serán divulgadas ni entregadas a ninguna otra institución o individuo sin su consentimiento expreso, excepto cuando la orden de entrega provenga de una autoridad judicial competente. Además, de acuerdo con la ley 1090 del 2006, es necesario quebrantar este principio de confidencialidad en caso de presentarse situaciones que pongan en grave peligro su integridad fisica o mental o de algún otro miembro de la comunidad.</p>
<h3 class="gh">2. MODELO DE TRATAMIENTO</h3>
<p style="font-size:13px;color:var(--mu);text-align:justify">El tratamiento que se le brinda es llevado a cabo con base en un modelo psicológico empíricamente validado, que en unos casos funciona mejor que en otros. Durante las primeras sesiones, se discutirá sobre los objetivos terapéuticos y la intervención a ejecutar.</p>
<h3 class="gh">3. USO DE INSTRUMENTOS</h3>
<p style="font-size:13px;color:var(--mu);text-align:justify">El proceso de atención psicológica requiere de su compromiso de asistencia, puntualidad y participación en los diferentes instrumentos que se adopten o sean necesarios, además de su colaboración para diligenciar una serie de posibles documentos, pruebas y entrevistas, con información personal que será utilizada para la evaluación e intervención.</p>
<h3 class="gh">4. MODALIDADES DE ATENCIÓN</h3>
<p style="font-size:13px;color:var(--mu);text-align:justify"><b>4.1 ATENCIÓN PSICOLÓGICA EN MODALIDAD VIRTUAL</b><br>
Las sesiones realizadas en modalidad virtual se llevarán a cabo mediante la plataforma Google Meet, a través de videollamada.<br>Una vez confirmada la consulta mediante el pago correspondiente, el profesional enviará al usuario el enlace de acceso a la sesión. Para el adecuado desarrollo de la sesión, el usuario deberá procurar conectarse desde un lugar en el que se sienta cómodo, tranquilo y que le permita contar con privacidad y condiciones adecuadas para el desarrollo de la atención psicológica.<br>Se recomienda que el usuario se encuentre en un espacio privado, evitando en lo posible la presencia o intervención de terceros que puedan afectar la privacidad, confidencialidad o desarrollo de la sesión.<br>El usuario deberá procurar contar con un dispositivo adecuado y una conexión a internet que permitan realizar la videollamada de manera adecuada.<br><br>
<b>4.2 ATENCIÓN PSICOLÓGICA EN MODALIDAD DOMICILIARIA</b><br>
El servicio de atención psicológica domiciliaria se encuentra disponible únicamente en Bogotá D.C. y está sujeto a disponibilidad de acuerdo con la dirección indicada por el usuario.<br>La viabilidad de la atención domiciliaria deberá ser confirmada previamente por el profesional antes de realizar la reserva de la sesión. La confirmación estará sujeta a las condiciones de desplazamiento, ubicación y disponibilidad de agenda.<br>El usuario deberá proporcionar previamente la dirección completa donde se realizará la atención y garantizar que el espacio destinado para la sesión permita desarrollar la atención psicológica en condiciones adecuadas de privacidad, tranquilidad y seguridad.<br>La confirmación de la viabilidad del servicio domiciliario no implica la reserva de la sesión. La reserva quedará sujeta a las condiciones de pago y confirmación establecidas en este documento.</p>
<h3 class="gh">5. REVOCACIÓN DEL CONSENTIMIENTO</h3>
<p style="font-size:13px;color:var(--mu);text-align:justify">Las decisiones sobre la continuidad o suspensión de las actividades programadas para la evaluación e intervención de la problemática abordada, son tomadas por usted.</p>
`;

    $('app').insertAdjacentHTML('beforeend', '<div id="mod" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px"><div class="pn" style="width:100%;max-width:400px;margin:0"><h3>Firma Profesional</h3><p class="sub">Al firmar, el documento quedará bloqueado definitivamente.</p><canvas id="mCv" width="350" height="150" style="width:100%;height:150px;background:#fff;border:1px dashed var(--bd);border-radius:6px;touch-action:none;cursor:crosshair"></canvas><div style="text-align:right;margin-top:6px"><button class="btn s sm" id="mClr" type="button" style="margin:0">Limpiar</button></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="mOk" disabled>Sellar Definitivamente</button><button class="btn s" id="mCx">Cancelar</button></div></div></div>');
    const cv=$('mCv'), cx=cv.getContext('2d');
    let drw=false, bV=true; cx.lineWidth = 2; cx.lineCap = 'round';
    const p = e => { const rt = cv.getBoundingClientRect(); return { x: (e.touches?e.touches[0].clientX:e.clientX)-rt.left, y: (e.touches?e.touches[0].clientY:e.clientY)-rt.top }; };
    const st = e => { e.preventDefault(); drw = true; bV = false; $('mOk').disabled=false; const c = p(e); cx.beginPath(); cx.moveTo(c.x, c.y); };
    const mv = e => { e.preventDefault(); if(!drw)return; const c = p(e); cx.lineTo(c.x, c.y); cx.stroke(); };
    const nd = e => { drw = false; };
    cv.addEventListener('mousedown', st); cv.addEventListener('mousemove', mv); cv.addEventListener('mouseup', nd); cv.addEventListener('mouseout', nd);
    cv.addEventListener('touchstart', st, {passive:false}); cv.addEventListener('touchmove', mv, {passive:false}); cv.addEventListener('touchend', nd);
    $('mClr').onclick = () => { cx.clearRect(0,0,cv.width,cv.height); bV=true; $('mOk').disabled=true; };
    $('mCx').onclick = () => $('mod').remove();
    $('mOk').onclick = async () => {
        $('mOk').disabled = true; $('mOk').textContent = 'Sellando...';
        try {
            await updateDoc(doc(db, 'responses', id), { 'd.psig': cv.toDataURL(), 'd.pdate': Date.now() });
            $('mod').remove(); C.it[id].d.psig = cv.toDataURL(); C.it[id].d.pdate = Date.now(); draw();
        } catch(err) {
            alert('Error al guardar. Asegúrate de actualizar las reglas de Firestore (ver abajo).');
            $('mOk').disabled = false; $('mOk').textContent = 'Sellar Definitivamente';
        }
    };
 }
}
