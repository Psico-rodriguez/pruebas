 +'<label class="ck"><input type="checkbox" id="spk"> Revisé el documento y firmo como '+esc(PRO)+' (T.P. '+TP+').</label><label class="ck"><input type="checkbox" id="sps"> Recordar mi firma en este dispositivo</label>'
 +'<button class="btn" id="spb" data-a="spb" data-id="'+id+'" disabled>Firmar, fechar y sellar</button><button class="btn s" data-a="spc2" data-id="'+id+'">Cancelar</button>';
function consentBody(id,r){const D=r.d||{},row=(k,v)=>'<tr><td>'+k+'</td><td>'+v+'</td></tr>';
 return '<table class="wide">'+row('Nombre',esc(r.name))+row('Documento',esc(r.tipo+' '+r.doc)+' · expedido en '+esc(D.exp||''))+row('Teléfono',esc(D.tel||''))+row('Firmado por el paciente',fdt(r.at))+row('Honorarios en el documento',r.c&&r.c.fees?'Incluidos':'No incluidos')
 +row('Firma del paciente',sgOK(r.sig)?'<img class="sgi" src="'+r.sig+'" alt="Firma">':'—')
 +row('Estado',r.sealed?'<b>Sellado</b> el '+fdt(r.pm)+' · código '+code(r.sh):'<b>Pendiente de su firma y sello</b>')+'</table>'
 +(r.sealed?'':'<div id="sg_'+id+'">'+(SIGN===id?signHTML(id):'')+'</div>')
 +'<button class="btn sm s" data-a="pf" data-id="'+id+'">'+(r.sealed?'Imprimir documento final (PDF)':'Imprimir copia (PDF)')+'</button>'
 +(r.sealed?'<button class="btn sm s" data-a="vf" data-id="'+id+'">Verificar integridad</button><p class="sub">Documento sellado y bloqueado: no se puede modificar ni eliminar.</p>':'<button class="btn sm" data-a="sg" data-id="'+id+'">Firmar y sellar</button><button class="btn sm s" data-a="del" data-id="'+id+'">Eliminar</button>')}
function listHTML(g,tt){const q=F.q.trim().toLowerCase();const a=Object.entries(C.it).filter(([,r])=>TESTS[r.t]&&(tt?r.t===tt:gr(r.t)===g&&(!F.t||r.t===F.t))&&(!q||(r.name+' '+r.doc).toLowerCase().includes(q))).sort((x,y)=>y[1].at-x[1].at);
 return a.length?a.map(([id,r])=>{const t=TESTS[r.t],nw=seen.has(id)?'':'<span class="bg">nuevo</span>';
  if(t.consent)return '<details data-id="'+id+'"><summary><b>'+esc(r.name)+'</b> · '+fdt(r.at)+(r.sealed?'<span class="bg" style="background:#2e9e5b">sellado</span>':'<span class="bg" style="background:#e5484d">por firmar</span>')+nw+'</summary>'+consentBody(id,r)+'</details>';
  return '<details data-id="'+id+'"><summary><b>'+esc(r.name)+'</b> · '+esc(t.n)+' · '+fdt(r.at)+nw+'</summary><p class="sub">'+esc(r.tipo)+' '+esc(r.doc)+'</p><table class="'+(t.lbl||t.socio?'wide':'')+'">'+rowsHTML(t,r)+'</table><button class="btn sm s" data-a="cp" data-id="'+id+'">Copiar respuestas</button><button class="btn sm s" data-a="pf" data-id="'+id+'">Imprimir diligenciado (PDF)</button><button class="btn sm s" data-a="pbr" data-id="'+id+'">Imprimir en blanco</button><button class="btn sm s" data-a="del" data-id="'+id+'">Eliminar</button></details>'}).join(''):'<p class="sub">No hay respuestas para mostrar.</p>'}
const refresh=()=>{if($('ls'))$('ls').innerHTML=listHTML('test');['consent','socio'].forEach(k=>{if($('ls_'+k))$('ls_'+k).innerHTML=listHTML('doc',k)})};
function vResp(){return '<div class="pn"><h2>Respuestas recibidas</h2><div class="r2"><select id="ft"><option value="">Todas las pruebas</option>'+byG('test').map(([k,v])=>'<option value="'+k+'"'+(F.t===k?' selected':'')+'>'+esc(v.n)+'</option>').join('')+'</select><input id="fq" placeholder="Buscar por nombre o documento" value="'+esc(F.q)+'"></div><button class="btn s" data-a="ex">Exportar a CSV</button><div id="ls">'+listHTML('test')+'</div></div>'}
function vDocs(){const pn=(k,h,s)=>'<div class="pn"><h2>'+h+'</h2><p class="sub" style="margin:0 0 6px">'+s+'</p><div id="ls_'+k+'">'+listHTML('doc',k)+'</div><button class="btn s" data-a="ex" data-t="'+k+'">Exportar a CSV</button></div>';
 return '<div class="pn"><input id="fq" placeholder="Buscar por nombre o documento" value="'+esc(F.q)+'"></div>'+pn('consent','Consentimientos informados','Firmados por el paciente; usted los firma y sella al final.')+pn('socio','Datos sociodemográficos','Información básica y antecedentes diligenciados por el paciente.')}
function vInst(){const one=([k,t])=>'<div class="pn"><h2>'+esc(t.n)+'</h2><p style="margin:0 0 6px"><b>'+esc(t.full)+'</b></p><p class="sub">'+(t.nq||FLD(t).length)+UN(t)+' · Periodo: '+INFO[k].per+(t.sc?' · Escala '+t.sc[0][0]+' a '+t.sc[t.sc.length-1][0]:'')+'</p><p style="font-size:13.5px">'+esc(INFO[k].corr)+'</p><p class="sub">'+INFO[k].ref.map(esc).join('<br>')+'</p><details><summary>'+(t.socio?'Ver secciones':'Ver preguntas'+(t.sc?' y escala':''))+'</summary>'+(t.sc?'<p class="sub">'+t.sc.map(x=>x[0]+' = '+esc(x[1])).join(' · ')+'</p>':'')+'<table>'+FLD(t).map((f,i)=>(f.h?'<tr><td><b>'+esc(f.h)+'</b></td></tr>':'')+'<tr><td>'+(f.n||i+1)+'. '+esc(f.q)+'</td></tr>').join('')+'</table></details><button class="btn sm" data-go="enviar" data-t="'+k+'">Enviar este instrumento</button><button class="btn sm s" data-a="pb" data-t="'+k+'">Imprimir en blanco (PDF)</button></div>';return[['test','Pruebas psicométricas'],['doc','Documentos clínicos']].map(([g,l])=>'<h2 class="gh" style="margin:6px 0 8px">'+l+'</h2>'+byG(g).map(one).join('')).join('')}
async function onClick(e){
 const g=e.target.closest('[data-go]');if(g){V=g.dataset.go;if(g.dataset.t)selT=g.dataset.t;draw();return}
 const sm=e.target.closest('summary');if(sm&&sm.parentNode.dataset.id){seen.add(sm.parentNode.dataset.id);save();tabs();return}
 const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,r=C.it[id];
  if(a==='sg'&&r&&!r.sealed){if(SIGN&&$('sg_'+SIGN))$('sg_'+SIGN).innerHTML='';SIGN=id;seen.add(id);save();$('sg_'+id).innerHTML=signHTML(id);SP=pad($('spc'),spu);return}
 if(a==='spx'){SP&&SP.clear();return}
 if(a==='spu'){const im=new Image();im.onload=()=>{SP.clear();SP.ctx.drawImage(im,0,0,600,200);SP.set()};im.src=LS('psg','');return}
 if(a==='spc2'){const i=SIGN;SIGN=null;SP=null;if(i&&$('sg_'+i))$('sg_'+i).innerHTML='';return}
 if(a==='spb'){b.disabled=true;b.textContent='Sellando…';
  try{const ref=doc(db,'responses',id),sn=await getDoc(ref);if(!sn.exists())throw{code:'no-existe'};const cd=sn.data();
   if(cd.sealed){C.it[id].sealed=true;SIGN=null;SP=null;save();draw();alert('Este documento ya estaba sellado.');return}
   const ps=SP.png(),pm=Date.now(),rr={t:cd.t,name:cd.name,tipo:cd.tipo,doc:cd.doc,d:cd.d,c:cd.c,sig:cd.sig,th:cd.th,at:cd.at.toMillis()},sh=await sha(canon(rr,ps,pm));
   await updateDoc(ref,{ps,pat:serverTimestamp(),pm,sh,sealed:true});
   if($('sps')&&$('sps').checked){try{localStorage.setItem('psg',JSON.stringify(ps))}catch(x){}}
   Object.assign(C.it[id],{ps,pm,sh,sealed:true});SIGN=null;SP=null;save();draw()}
  catch(x){b.disabled=false;b.textContent='Firmar, fechar y sellar';alert('No se pudo sellar ('+(x.code||'error')+'). Revisa que las reglas de seguridad estén publicadas.')}return}
 if(a==='vf'&&r){const ok1=(await sha(canon(r,r.ps,r.pm)))===r.sh,ok2=(await sha(cplain(r.c)))===r.th;alert(ok1?(ok2?'Documento íntegro: coincide con lo firmado y sellado.':'Los datos firmados son íntegros, pero el texto del formato cambió en la app después de la firma.'):'¡Atención! Los datos de este documento no coinciden con su código de sellado.');return}
 if(a==='del'&&r&&r.sealed){alert('Un documento sellado no se puede eliminar.');return}
 if(a==='ex'&&b.dataset.t==='consent'){const q=s=>'"'+String(s).replace(/"/g,'""')+'"',rows=Object.entries(C.it).filter(([,r2])=>r2.t==='consent').sort((x,y)=>x[1].at-y[1].at),H=['fecha_firma','codigo','nombre','tipo_doc','documento','expedido_en','telefono','honorarios_incluidos','estado','fecha_sello','codigo_verificacion'];
  const out=[H.map(q).join(',')].concat(rows.map(([i2,r2])=>[fdt(r2.at),i2,r2.name,r2.tipo,r2.doc,(r2.d||{}).exp||'',(r2.d||{}).tel||'',r2.c&&r2.c.fees?'sí':'no',r2.sealed?'sellado':'por firmar',r2.sealed?fdt(r2.pm):'',r2.sealed?code(r2.sh):''].map(q).join(',')));
  const l=document.createElement('a');l.href=URL.createObjectURL(new Blob(['\ufeff'+out.join('\n')],{type:'text/csv'}));l.download='respuestas-Consentimiento.csv';l.click();return}
 if(a==='mk'){b.disabled=true;try{const d=doc(collection(db,'invites'));await setDoc(d,{t:selT,n:PRO,status:'pending',createdAt:serverTimestamp(),exp:Timestamp.fromMillis(Date.now()+30*864e5),...(selT==='consent'?{cfg:cfgSave()}:{})});
   LK.unshift({id:d.id,l:location.origin+location.pathname+'?i='+d.id,t:selT,at:Date.now()});LK=LK.slice(0,30);save();draw()}
  catch(x){b.disabled=false;$('er').hidden=false;$('er').textContent='No se pudo crear el enlace ('+(x.code||'error')+'). Revisa que las reglas de seguridad estén publicadas.'}}
 if(a==='lk'){try{await navigator.clipboard.writeText(LK[+b.dataset.i].l);b.textContent='¡Copiado!'}catch(x){}}
 if(a==='pb'){printDoc(b.dataset.t||selT,null);return}
 if(a==='pf'&&r){printDoc(r.t,r.ans,r.t==='consent'?r:{name:r.name,tipo:r.tipo,doc:r.doc,x:r.x,d:r.d,at:r.at});return}
 if(a==='pbr'&&r){printDoc(r.t,null);return}
 if(a==='sync'){b.disabled=true;try{const q=await getDocs(query(collection(db,'invites'),orderBy('createdAt','desc'),limit(30)));LK=q.docs.map(d=>{const v=d.data();return{id:d.id,l:location.origin+location.pathname+'?i='+d.id,t:v.t,at:v.createdAt?v.createdAt.toMillis():0,st:v.status,exp:v.exp?v.exp.toMillis():0}});save();draw()}catch(x){b.disabled=false;alert('No se pudo actualizar ('+(x.code||'error')+').')}return}
 if(a==='dl'){const n=+b.dataset.i,x=LK[n];if(x&&confirm('¿Eliminar este enlace? Dejará de funcionar. Las respuestas ya recibidas no se borran.')){try{await deleteDoc(doc(db,'invites',x.id||new URL(x.l).searchParams.get('i')));LK.splice(n,1);save();draw()}catch(x2){alert('No se pudo eliminar ('+(x2.code||'error')+').')}}return}
 if(a==='cp'){const t=TESTS[r.t];try{await navigator.clipboard.writeText('RESPUESTAS '+t.n+'\n'+r.name+' · '+r.tipo+' '+r.doc+'\n'+fdt(r.at)+'\n'+(t.socio?SDL.map(([k,l])=>l+': '+(sdv(r.d||{},k).replace(/\n/g,'; ')||'—')).join('\n'):[...r.ans].map((v,i)=>(FLD(t)[i].n||i+1)+': '+LBL(t,FLD(t)[i],v)).join('\n')));b.textContent='¡Copiado!'}catch(x){}}
 if(a==='del'&&confirm('¿Eliminar esta respuesta de forma definitiva?')){const w=writeBatch(db);w.delete(doc(db,'responses',id));w.delete(doc(db,'invites',id));await w.commit();delete C.it[id];save();draw()}
 if(a==='ex'){const ft=b.dataset.t||F.t||'dass21',t=TESTS[ft],q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=Object.entries(C.it).filter(([,r])=>r.t===ft).sort((x,y)=>x[1].at-y[1].at);
  const out=[['fecha','codigo','nombre','tipo_doc','documento'].concat(t.socio?SDL.map(x=>x[1]):FLD(t).map((f,i)=>'p'+(f.n||i+1)).concat(t.lbl?['otros_especifique']:[])).map(q).join(',')].concat(rows.map(([id,r])=>[fdt(r.at),id,r.name,r.tipo,r.doc].concat(t.socio?SDL.map(([k])=>sdv(r.d||{},k).replace(/\n/g,' | ')):[...r.ans].map((c,i)=>LBL(t,FLD(t)[i],c)),t.lbl?[r.x||'']:[]).map(q).join(',')));
  const l=document.createElement('a');l.href=URL.createObjectURL(new Blob(['\ufeff'+out.join('\n')],{type:'text/csv'}));l.download='respuestas-'+t.n+'.csv';l.click()}}
if(FB.apiKey==='PEGA_AQUI')$('app').innerHTML='<div class="pn">Falta pegar la configuración de Firebase en index.html (ver LEEME.md).</div>';
else if(ID)patient();else onAuthStateChanged(auth,u=>u?shell():login());
</script></body></html>
